<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure - Sign in</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .split {
      flex: 1;
      display: flex;
      flex-direction: row;
      min-height: 0;
      width: 100%;
    }
    /* left / gallery */
    .left {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 48px;
      overflow: hidden;
    }
    .collage {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(3, 110px);
      gap: 16px;
      max-width: 640px;
    }
    .tile {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s ease;
    }
    .tile:hover { transform: translateY(-4px) scale(1.02); }
    .t1 { grid-column: 1 / 6; grid-row: 1 / 3; }
    .t2 { grid-column: 6 / 13; grid-row: 1 / 2; }
    .t3 { grid-column: 6 / 10; grid-row: 2 / 4; }
    .t4 { grid-column: 10 / 13; grid-row: 2 / 3; }
    .quote {
      margin-top: 28px;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }
    /* right / form */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      padding: 32px 28px;
    }
    .card h2 {
      margin: 0 0 4px;
      font-size: 22px;
    }
    .subtitle {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 13px;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      color: var(--text);
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0b1526;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button[type="submit"] {
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: var(--grad);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(217, 70, 239, 0.35);
    }
    button[type="submit"]:hover { background: linear-gradient(135deg, #f472b6, #a78bfa); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
      font-size: 13px;
    }
    .error.show { display: block; }
    .back {
      display: inline-block;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }
    .back:hover { color: var(--text); }
    /* ---------- responsive ---------- */
    @media (max-width: 920px) {
      .split { flex: 1; flex-direction: column; }
      .left {
        flex: none;
        justify-content: flex-start;
        align-items: center;
        padding: 32px 24px 16px;
      }
      .collage {
        grid-template-rows: repeat(3, 84px);
        max-width: none;
        gap: 10px;
      }
      .quote { margin: 14px 0 0; }
      .right { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <img id="bgImage" alt="">
  <div id="bgOverlay"></div>
  <div class="page">
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">M</div>
      <h1>Adventure</h1>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blogs.html">Blogs</a>
    </nav>
    <button class="hamburger" id="navToggle" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="user-menu">
      <a class="btn-sm" id="navSignIn" href="login.html">Sign in</a>
      <button class="user-btn" id="userMenuBtn" type="button" style="display:none">
        <img id="navAvatar" alt="Avatar">
        <span id="navUsername"></span>
        <span class="caret">&#9662;</span>
      </button>
      <div class="dropdown" id="userDropdown" style="display:none">
        <a href="#" id="ddProfile">Account</a>
        <a href="#" id="ddSignOut">Sign out</a>
      </div>
    </div>
  </header>
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blogs.html">Blogs</a>
  </div>

  <div class="split">
    <aside class="left">
      <div class="collage">
        <img class="tile t1" src="https://picsum.photos/id/1015/440/640" alt="Scenery">
        <img class="tile t2" src="https://picsum.photos/id/1050/660/240" alt="Scenery">
        <img class="tile t3" src="https://picsum.photos/id/1035/440/440" alt="Scenery">
        <img class="tile t4" src="https://picsum.photos/id/1067/300/240" alt="Scenery">
      </div>
      <p class="quote">"Explore our world. One account to rule them all."</p>
    </aside>

    <main class="right">
      <div class="card">
        <h2>Sign in</h2>
        <p class="subtitle">Access your account on Adventure</p>
        <form id="loginForm" novalidate>
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button id="submitBtn" type="submit">Sign in</button>
        </form>
        <div id="error" class="error"></div>
        <a class="back" href="index.html">&larr; Back to home</a>
      </div>
    </main>
  </div>

  <footer class="footer">
    <span>&copy; 2026 Adventure</span>
    <nav>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="support.html">Support</a>
    </nav>
  </footer>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      const loginForm = document.getElementById('loginForm');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const submitBtn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.add('show');
      }

      function clearError() {
        errorEl.textContent = '';
        errorEl.classList.remove('show');
      }

      async function login(username, password) {
        const res = await Adventure.api('/v1/login', {
          method: 'POST',
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || 'Login failed (HTTP ' + res.status + ')');
        return data.user;
      }

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';
        try {
          const user = await login(usernameInput.value.trim(), passwordInput.value);
          Adventure.setUser(user);
          location.href = 'index.html';
        } catch (err) {
          showError(err.message);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign in';
        }
      });

      window.Adventure = window.Adventure || {};
      window.Adventure.onAuth = function (user) {
        if (user) location.replace('index.html');
      };
    })();
  </script>
</body>
</html>
