<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventure - Blogs</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .blogs-main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 48px;
    }
    .blogs-main h2 {
      margin: 0 0 22px;
      font-size: 26px;
    }
    .blogs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .post-card {
      display: flex;
      flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .post-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
    }
    .post-thumb {
      height: 170px;
      background-size: cover;
      background-position: center;
      background-color: #241539;
    }
    .post-body {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
      padding: 18px 20px 20px;
    }
    .post-body h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.35;
    }
    .post-body h3 a {
      color: var(--text);
      text-decoration: none;
    }
    .post-body h3 a:hover { color: var(--accent); }
    .post-excerpt {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      flex: 1;
    }
    .post-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      color: var(--muted);
      font-size: 12px;
    }
    .post-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      padding: 2px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
    }
    .blogs-state {
      text-align: center;
      color: var(--muted);
      padding: 60px 20px;
      font-size: 15px;
    }
    .blogs-state.error { color: var(--danger); }
    @media (max-width: 920px) {
      .blogs-main { padding: 28px 20px 40px; }
    }
  </style>
</head>
<body>
  <img id="bgImage" alt="">
  <div id="bgOverlay"></div>
  <div class="page">
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">B</div>
      <h1>Adventure</h1>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blogs.html" class="active">Blogs</a>
    </nav>
    <button class="hamburger" id="navToggle" type="button" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="user-menu">
      <a class="btn-sm" id="navSignIn" href="login.html">Sign in</a>
      <button class="user-btn" id="userMenuBtn" type="button" style="display:none">
        <img id="navAvatar" alt="Avatar">
        <span id="navUsername"></span>
        <span class="caret">&#9662;</span>
      </button>
      <div class="dropdown" id="userDropdown" style="display:none">
        <a href="#" id="ddProfile">Profile</a>
        <a href="#" id="ddSignOut">Sign out</a>
      </div>
    </div>
  </header>
  <div class="mobile-nav" id="mobileNav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="blogs.html" class="active">Blogs</a>
  </div>

  <main class="blogs-main">
    <h2>Blogs</h2>
    <div id="blogsGrid" class="blogs-grid"></div>
    <div id="blogsEmpty" class="blogs-state">No posts yet. Check back soon.</div>
  </main>

  <footer class="footer">
    <span>&copy; 2026 Adventure</span>
    <nav>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
      <a href="support.html">Support</a>
    </nav>
  </footer>
  </div>

  <script src="app.js"></script>
  <script>
    (function () {
      const grid = document.getElementById('blogsGrid');
      const emptyEl = document.getElementById('blogsEmpty');
      const BLOGS_API = '/blog/api/public/posts';

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalize(post) {
        const title = post.title || post.name || 'Untitled';
        const content = post.content
          ? String(post.content).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim()
          : '';
        const excerpt = post.excerpt || post.summary || post.description || content.slice(0, 160);
        const image = post.featured_image || post.cover_image || post.coverImage || post.featuredImage || post.hero_image || post.image || post.thumbnail || '';
        const author = post.author_name || post.authorName || post.author || post.username || '';
        const date = post.published_at || post.publishedAt || post.date || post.created_at || post.createdAt || post.updated_at || '';
        const tags = Array.isArray(post.tags)
          ? post.tags.map(function (t) { return typeof t === 'string' ? t : (t.name || t.slug || ''); }).filter(Boolean)
          : [];
        let url = post.url || '';
        if (!url && post.slug) url = 'posts/' + String(post.slug).replace(/^\//, '') + '.html';
        return { title: esc(title), excerpt: esc(excerpt), image, author: esc(author), date: esc(date), tags, url };
      }

      function formatDate(s) {
        const d = new Date(s);
        if (isNaN(d.getTime())) return s;
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function render(posts) {
        if (!posts.length) {
          emptyEl.style.display = '';
          return;
        }
        emptyEl.style.display = 'none';
        grid.innerHTML = posts.map(function (post) {
          const thumb = post.image
            ? 'background-image:url("' + post.image.replace(/"/g, '%22') + '")'
            : '';
          const title = post.url
            ? '<a href="' + post.url + '">' + post.title + '</a>'
            : post.title;
          const meta = [];
          if (post.author) meta.push('<span>By ' + post.author + '</span>');
          if (post.date) meta.push('<span>' + formatDate(post.date) + '</span>');
          const tags = post.tags.length
            ? '<div class="post-tags">' + post.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>'
            : '';
          return '<article class="post-card">' +
            (thumb ? '<div class="post-thumb" style="' + thumb + '"></div>' : '') +
            '<div class="post-body">' +
              '<h3>' + title + '</h3>' +
              '<p class="post-excerpt">' + (post.excerpt || '') + '</p>' +
              '<div class="post-meta">' + meta.join('') + '</div>' +
              tags +
            '</div>' +
          '</article>';
        }).join('');
      }

      async function load() {
        try {
          const res = await fetch(BLOGS_API);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const raw = Array.isArray(data)
            ? data
            : (data.items || data.results || data.posts || data.data || []);
          render(raw.map(normalize));
        } catch (err) {
          emptyEl.textContent = 'Could not load blogs. Please try again later.';
          emptyEl.className = 'blogs-state error';
          emptyEl.style.display = '';
        }
      }

      load();
    })();
  </script>
</body>
</html>
