server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 25m;
    # Docker's embedded DNS can return a new container IP after a service is
    # recreated. Resolve service names at request time instead of pinning the
    # IP Nginx saw when this container started.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $iam_backend http://iam:3000;
    set $blogs_backend http://blogs:4000;
    set $sitemaster_backend http://sitemaster:5000;

    # IAM's browser UI is mounted below /iam. The trailing slash in
    # proxy_pass strips /iam before the request reaches the Node service.
    location = /iam {
        return 301 /iam/$is_args$args;
    }

    # IAM is a single-page application. Keep index.html as an implementation
    # detail and preserve recovery/OIDC query parameters during canonicalization.
    location = /iam/index.html {
        return 301 /iam/$is_args$args;
    }

    location /iam/ {
        rewrite ^/iam/(.*)$ /$1 break;
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blogs owns the /blog site path. Omitting the URI from proxy_pass keeps
    # /blog in the upstream request, where Blogs' SITE_PATH middleware removes
    # it consistently for HTML, assets, admin, and APIs.
    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        proxy_pass $blogs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sitemaster is the standalone control plane. This optional same-origin
    # proxy lets the deployed Mainsite consume Sitemaster's public APIs without
    # CORS; it does not make Mainsite the Sitemaster console.
    location = /sitemaster {
        return 301 /sitemaster/;
    }

    location /sitemaster/ {
        rewrite ^/sitemaster/(.*)$ /$1 break;
        proxy_pass $sitemaster_backend;
        proxy_redirect / /sitemaster/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Additional Sitemaster-generated local websites are served below
    # /sites/<slug>/. If a site has not been published yet, fall back to
    # Sitemaster's read-only preview route. Mainsite itself is the primary
    # deployed site and is served by this Nginx instance at / on port 8080.
    location /sites/ {
        try_files $uri $uri/index.html @sitemaster_site_preview;
    }

    location @sitemaster_site_preview {
        proxy_pass $sitemaster_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Site and its existing /api/auth contract use the same origin. Keep
    # the IAM API prefix intact when proxying to the service.
    location = /api/auth {
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Standards-based OAuth/OIDC endpoints and versioned IAM APIs.
    location /oauth/ {
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass $iam_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
